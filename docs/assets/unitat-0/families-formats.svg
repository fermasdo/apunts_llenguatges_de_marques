<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1000" role="img" aria-labelledby="families-title families-desc">
  <title id="families-title">Matriu de formats i famílies d'ús</title>
  <desc id="families-desc">Matriu amb sis formats en files i quatre famílies en columnes: marques, serialització, configuració i text lleuger. Els punts indiquen usos principals o habituals. XML ocupa marques, serialització i configuració; YAML, serialització i configuració; Markdown, marques lleugeres i text lleuger.</desc>
  <rect width="600" height="1000" rx="24" fill="#f8fafc"/>
  <rect x="14" y="14" width="572" height="972" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="300" y="55" text-anchor="middle" font-size="32" font-weight="700" fill="#172033">Formats × famílies d'ús</text>
    <text x="300" y="91" text-anchor="middle" font-size="26" fill="#475569">Files: formats · columnes: usos</text>

    <rect x="30" y="118" width="540" height="490" rx="16" fill="#ffffff"/>
    <rect x="32" y="120" width="536" height="66" rx="14" fill="#eef2ff"/>
    <rect x="32" y="260" width="536" height="66" fill="#f8fafc"/>
    <rect x="32" y="400" width="536" height="66" fill="#f8fafc"/>
    <rect x="32" y="540" width="536" height="66" rx="0 0 14 14" fill="#f8fafc"/>
    <rect x="30" y="118" width="540" height="490" rx="16" fill="none" stroke="#64748b" stroke-width="2"/>
    <path d="M190 118 V608 M285 118 V608 M380 118 V608 M475 118 V608" stroke="#64748b" stroke-width="2"/>
    <path d="M30 188 H570 M30 258 H570 M30 328 H570 M30 398 H570 M30 468 H570 M30 538 H570" stroke="#64748b" stroke-width="2"/>

    <text x="50" y="162" font-size="26" font-weight="700" fill="#172033">Format</text>
    <text x="238" y="162" text-anchor="middle" font-size="28" font-weight="700" fill="#4051b5">M</text>
    <text x="333" y="162" text-anchor="middle" font-size="28" font-weight="700" fill="#0e7490">S</text>
    <text x="428" y="162" text-anchor="middle" font-size="28" font-weight="700" fill="#a15c00">C</text>
    <text x="523" y="162" text-anchor="middle" font-size="28" font-weight="700" fill="#26734d">T</text>

    <g font-size="26" font-weight="700" fill="#172033">
      <text x="50" y="232">HTML</text>
      <text x="50" y="302">XML</text>
      <text x="50" y="372">JSON</text>
      <text x="50" y="442">YAML</text>
      <text x="50" y="512">TOML</text>
      <text x="50" y="582">Markdown</text>
    </g>
    <g text-anchor="middle" font-size="30" font-weight="700">
      <text x="238" y="232" fill="#4051b5">●</text><text x="333" y="232" fill="#64748b">–</text><text x="428" y="232" fill="#64748b">–</text><text x="523" y="232" fill="#64748b">–</text>
      <text x="238" y="302" fill="#4051b5">●</text><text x="333" y="302" fill="#0e7490">●</text><text x="428" y="302" fill="#a15c00">●</text><text x="523" y="302" fill="#64748b">–</text>
      <text x="238" y="372" fill="#64748b">–</text><text x="333" y="372" fill="#0e7490">●</text><text x="428" y="372" fill="#a15c00">●</text><text x="523" y="372" fill="#64748b">–</text>
      <text x="238" y="442" fill="#64748b">–</text><text x="333" y="442" fill="#0e7490">●</text><text x="428" y="442" fill="#a15c00">●</text><text x="523" y="442" fill="#64748b">–</text>
      <text x="238" y="512" fill="#64748b">–</text><text x="333" y="512" fill="#64748b">–</text><text x="428" y="512" fill="#a15c00">●</text><text x="523" y="512" fill="#64748b">–</text>
      <text x="238" y="582" fill="#4051b5">●</text><text x="333" y="582" fill="#64748b">–</text><text x="428" y="582" fill="#64748b">–</text><text x="523" y="582" fill="#26734d">●</text>
    </g>

    <text x="42" y="650" font-size="28" font-weight="700" fill="#172033">Clau de lectura</text>
    <text x="42" y="684" font-size="26" fill="#334155"><tspan font-weight="700">●</tspan> ús principal o habitual</text>
    <text x="42" y="716" font-size="26" fill="#334155"><tspan font-weight="700">–</tspan> no és l'ús principal ací</text>
    <text x="42" y="754" font-size="26" fill="#334155"><tspan font-weight="700">M</tspan> Marques · <tspan font-weight="700">S</tspan> Serialització</text>
    <text x="42" y="786" font-size="26" fill="#334155"><tspan font-weight="700">C</tspan> Configuració · <tspan font-weight="700">T</tspan> Text lleuger</text>

    <rect x="30" y="808" width="540" height="160" rx="16" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="48" y="844" font-size="26" font-weight="700" fill="#172033">Solapaments visibles en la matriu</text>
    <text x="48" y="884" font-size="26" fill="#334155"><tspan font-weight="700">XML</tspan> = M + S + C · <tspan font-weight="700">YAML</tspan> = S + C</text>
    <text x="48" y="924" font-size="26" fill="#334155"><tspan font-weight="700">Markdown</tspan> = M + T</text>
    <text x="48" y="954" font-size="26" fill="#334155">Marques lleugeres i text lleuger</text>
  </g>
</svg>
