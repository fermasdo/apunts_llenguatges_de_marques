<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1120" role="img" aria-labelledby="diagnostic-title diagnostic-desc">
  <title id="diagnostic-title">Cicle reproduïble de diagnòstic</title>
  <desc id="diagnostic-desc">Cicle vertical de sis passos units per fletxes: reproduïx, llig el primer error, localitza, canvia una cosa, repetix i registra. Una fletxa lateral torna del registre a la reproducció.</desc>
  <defs>
    <marker id="diagnostic-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#4051b5"/>
    </marker>
  </defs>
  <rect width="600" height="1120" rx="24" fill="#f8fafc"/>
  <rect x="14" y="14" width="572" height="1092" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="300" y="55" text-anchor="middle" font-size="32" font-weight="700" fill="#172033">Cicle de diagnòstic</text>
    <text x="300" y="91" text-anchor="middle" font-size="26" fill="#475569">Canvia una cosa i repetix la mateixa prova.</text>

    <path d="M280 252 V268 M280 408 V424 M280 564 V580 M280 720 V736 M280 876 V892" stroke="#4051b5" stroke-width="4" marker-end="url(#diagnostic-arrow)"/>
    <path d="M520 969 H554 V189 H522" fill="none" stroke="#4051b5" stroke-width="4" stroke-linejoin="round" marker-end="url(#diagnostic-arrow)"/>

    <rect x="40" y="126" width="480" height="126" rx="18" fill="#eef2ff" stroke="#4051b5" stroke-width="3"/>
    <circle cx="76" cy="166" r="24" fill="#4051b5"/><text x="76" y="175" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">1</text>
    <text x="112" y="174" font-size="28" font-weight="700" fill="#172033">Reproduïx</text>
    <text x="64" y="216" font-size="26" fill="#334155">Executa l'ordre exacta.</text>

    <rect x="40" y="282" width="480" height="126" rx="18" fill="#ecfeff" stroke="#0e7490" stroke-width="3"/>
    <circle cx="76" cy="322" r="24" fill="#0e7490"/><text x="76" y="331" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">2</text>
    <text x="112" y="330" font-size="28" font-weight="700" fill="#172033">Llig el primer error</text>
    <text x="64" y="370" font-size="26" fill="#334155">Llig-lo complet abans</text>
    <text x="64" y="400" font-size="26" fill="#334155">dels errors posteriors.</text>

    <rect x="40" y="438" width="480" height="126" rx="18" fill="#fff7ed" stroke="#a15c00" stroke-width="3"/>
    <circle cx="76" cy="478" r="24" fill="#a15c00"/><text x="76" y="487" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">3</text>
    <text x="112" y="486" font-size="28" font-weight="700" fill="#172033">Localitza</text>
    <text x="64" y="526" font-size="26" fill="#334155">Busca el fitxer, la línia</text>
    <text x="64" y="556" font-size="26" fill="#334155">i la columna.</text>

    <rect x="40" y="594" width="480" height="126" rx="18" fill="#ecfdf5" stroke="#26734d" stroke-width="3"/>
    <circle cx="76" cy="634" r="24" fill="#26734d"/><text x="76" y="643" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">4</text>
    <text x="112" y="642" font-size="28" font-weight="700" fill="#172033">Canvia una cosa</text>
    <text x="64" y="684" font-size="26" fill="#334155">Modifica només un element.</text>

    <rect x="40" y="750" width="480" height="126" rx="18" fill="#eef2ff" stroke="#4051b5" stroke-width="3"/>
    <circle cx="76" cy="790" r="24" fill="#4051b5"/><text x="76" y="799" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">5</text>
    <text x="112" y="798" font-size="28" font-weight="700" fill="#172033">Repetix</text>
    <text x="64" y="838" font-size="26" fill="#334155">Executa la mateixa prova</text>
    <text x="64" y="868" font-size="26" fill="#334155">i compara l'eixida.</text>

    <rect x="40" y="906" width="480" height="126" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/>
    <circle cx="76" cy="946" r="24" fill="#475569"/><text x="76" y="955" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">6</text>
    <text x="112" y="954" font-size="28" font-weight="700" fill="#172033">Registra</text>
    <text x="64" y="994" font-size="26" fill="#334155">Anota què esperaves, què passà</text>
    <text x="64" y="1024" font-size="26" fill="#334155">i què provares.</text>

    <rect x="150" y="1050" width="300" height="42" rx="21" fill="#4051b5"/>
    <text x="300" y="1080" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">Torna a reproduir</text>
  </g>
</svg>
