<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">Visualització d'El meu primer catàleg en un navegador</title>
  <desc id="desc">Una finestra de navegador mostra el títol Catàleg de l’aula, el text Materials per a començar i una llista amb Quadern i Retolador.</desc>
  <rect width="960" height="460" rx="24" fill="#f3f6fb"/>
  <rect x="70" y="50" width="820" height="360" rx="18" fill="#ffffff" stroke="#253858" stroke-width="4"/>
  <path d="M70 118h820" stroke="#253858" stroke-width="4"/>
  <circle cx="104" cy="84" r="10" fill="#b42318"/>
  <circle cx="136" cy="84" r="10" fill="#b54708"/>
  <circle cx="168" cy="84" r="10" fill="#067647"/>
  <rect x="220" y="67" width="420" height="34" rx="17" fill="#e8edf5"/>
  <text x="242" y="90" fill="#253858" font-family="system-ui, sans-serif" font-size="18">El meu primer catàleg</text>
  <text x="132" y="188" fill="#172b4d" font-family="system-ui, sans-serif" font-size="38" font-weight="700">Catàleg de l’aula</text>
  <text x="132" y="244" fill="#253858" font-family="system-ui, sans-serif" font-size="25">Materials per a començar.</text>
  <circle cx="150" cy="294" r="6" fill="#253858"/>
  <text x="174" y="303" fill="#253858" font-family="system-ui, sans-serif" font-size="24">Quadern</text>
  <circle cx="150" cy="342" r="6" fill="#253858"/>
  <text x="174" y="351" fill="#253858" font-family="system-ui, sans-serif" font-size="24">Retolador</text>
</svg>
