<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">Parts d'una etiqueta de paràgraf HTML</title>
  <desc id="desc">Un diagrama d'esquerra a dreta connecta l'etiqueta d'obertura p, el contingut Materials per a començar i l'etiqueta de tancament barra p.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#253858"/></marker>
  </defs>
  <rect width="960" height="300" rx="24" fill="#f3f6fb"/>
  <rect x="50" y="80" width="220" height="140" rx="16" fill="#e7f0ff" stroke="#1d4ed8" stroke-width="4"/>
  <text x="160" y="132" text-anchor="middle" fill="#172b4d" font-family="ui-monospace, monospace" font-size="36" font-weight="700">&lt;p&gt;</text>
  <text x="160" y="177" text-anchor="middle" fill="#172b4d" font-family="system-ui, sans-serif" font-size="19">obertura</text>
  <path d="M286 150h98" fill="none" stroke="#253858" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="335" y="128" text-anchor="middle" fill="#253858" font-family="system-ui, sans-serif" font-size="17">conté</text>
  <rect x="400" y="80" width="270" height="140" rx="16" fill="#ffffff" stroke="#253858" stroke-width="4"/>
  <text x="535" y="142" text-anchor="middle" fill="#172b4d" font-family="system-ui, sans-serif" font-size="23" font-weight="700">Materials per a</text>
  <text x="535" y="172" text-anchor="middle" fill="#172b4d" font-family="system-ui, sans-serif" font-size="23" font-weight="700">començar.</text>
  <path d="M686 150h98" fill="none" stroke="#253858" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="735" y="128" text-anchor="middle" fill="#253858" font-family="system-ui, sans-serif" font-size="17">es tanca amb</text>
  <rect x="800" y="80" width="110" height="140" rx="16" fill="#e7f0ff" stroke="#1d4ed8" stroke-width="4"/>
  <text x="855" y="132" text-anchor="middle" fill="#172b4d" font-family="ui-monospace, monospace" font-size="31" font-weight="700">&lt;/p&gt;</text>
  <text x="855" y="177" text-anchor="middle" fill="#172b4d" font-family="system-ui, sans-serif" font-size="19">tancament</text>
</svg>
