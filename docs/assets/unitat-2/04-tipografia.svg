<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">Tipografia llegible</title><desc id="d">Finestra de navegador amb encapçalaments, text i enllaç amb jerarquia visual.</desc><rect width="960" height="460" rx="24" fill="#f3f6fb"/><g stroke="#253858" stroke-width="3"><rect x="70" y="45" width="820" height="370" rx="18" fill="#fffdf8"/><path d="M70 112h820"/></g><circle cx="106" cy="79" r="9" fill="#b42318"/><circle cx="134" cy="79" r="9" fill="#b54708"/><circle cx="162" cy="79" r="9" fill="#067647"/><text x="130" y="180" font-family="system-ui" font-size="36" font-weight="700" fill="#075985">Cuida la teua bicicleta</text><text x="130" y="230" font-family="system-ui" font-size="25" font-weight="700" fill="#075985">Manteniment periòdic</text><text x="130" y="275" font-family="system-ui" font-size="20" fill="#24303a">Una revisió regular millora la seguretat i allarga la vida útil</text><text x="130" y="307" font-family="system-ui" font-size="20" fill="#24303a">dels components. Demana hora amb antelació.</text><text x="130" y="360" font-family="system-ui" font-size="20" fill="#075985">Consulta els horaris del taller</text></svg>
